# ─────────────────────────────────────────────────────────────────────────────
# Punto — Compose para Coolify (staging / beta)
#
# Tras dissolve-panel (2026-06-29) el servicio `panel` fue eliminado.
# El backend admin se movió a api/v1/admin/. El front admin vive en frontend/.
#
# Servicios:
#   api    → https://api.punto.la    (backend PHP compartido; admin en /v1/admin/)
#   ws     → https://ws.punto.la     (WebSocket WSS, Node 20)
#
# INFRA FLAG: panel.punto.la y admin.punto.la deben apuntar al container
# del frontend Next.js (frontend/), NO a este API PHP. Actualizar DNS +
# Coolify para ambos subdominios.
#
# Postgres se asume MANAGED por Coolify (POSTGRES_HOST en env apunta al host
# que Coolify expone). Redis se levanta acá porque no requiere persistencia
# crítica para el cache + WS pubsub.
#
# Build context = ROOT del repo.
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:

  # ── API compartida (api.punto.la) ───────────────────────────────────────────
  # También sirve admin realm en /v1/admin/* (desde dissolve-panel 2026-06-29).
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    depends_on:
      - redis
    networks:
      - punto_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.punto.la`)"
      - "traefik.http.routers.api.entrypoints=https"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-svc.loadbalancer.server.port=3000"
      - "traefik.http.routers.api.service=api-svc"


  # ── WebSocket server (ws.punto.la) ──────────────────────────────────────────
  ws:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WS_PORT: "6001"
      REDIS_URL: redis://redis:6379
    expose:
      - "6001"
    depends_on:
      - redis
    networks:
      - punto_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ws.rule=Host(`ws.punto.la`)"
      - "traefik.http.routers.ws.entrypoints=https"
      - "traefik.http.routers.ws.tls=true"
      - "traefik.http.routers.ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.ws-svc.loadbalancer.server.port=6001"
      - "traefik.http.routers.ws.service=ws-svc"


  # ── Redis (cache + WS pubsub) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - punto_net


volumes:
  redis_data:
    driver: local


networks:
  punto_net:
    driver: bridge
