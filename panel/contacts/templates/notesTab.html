<!-- notesTab — nota libre del contacto (contactNote → data JSONB). -->
<div class="tab-pane bg-white col-xs-12 no-padder animated fadeIn speed-4x" id="contactNotesTab" style="min-height:400px;">
	<div class="col-xs-12 wrapper-md">
		<span class="font-bold text-u-c text-xs">Nota</span>
		<textarea class="form-control no-border b-b b-light no-bg" rows="8" name="note" placeholder="Nota interna sobre el contacto" autocomplete="off">{{note}}</textarea>
	</div>
</div>
