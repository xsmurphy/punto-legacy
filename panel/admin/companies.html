<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Punto · Admin · Empresas</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
            --danger: #ef4444;
            --warn: #f59e0b;
            --ok: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 18px; font-weight: 600; }
        header nav a {
            color: var(--muted); text-decoration: none;
            font-size: 14px; margin-right: 16px;
        }
        header nav a:hover { color: var(--text); }

        main { max-width: 1400px; margin: 32px auto; padding: 0 24px; }

        .toolbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; gap: 16px; flex-wrap: wrap;
        }
        .toolbar h2 { font-size: 20px; }
        .toolbar .search {
            flex: 1; max-width: 360px;
            padding: 9px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text); font-size: 14px;
        }
        .toolbar .search:focus { outline: none; border-color: var(--accent); }

        .stats {
            color: var(--muted); font-size: 13px;
        }

        table {
            width: 100%; border-collapse: collapse;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            text-align: left; padding: 10px 12px;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--muted); font-weight: 500;
            font-size: 11px; text-transform: uppercase;
            letter-spacing: .04em; white-space: nowrap;
            background: rgba(15, 23, 42, .4);
        }
        tbody tr { cursor: pointer; }
        tbody tr:hover { background: rgba(59, 130, 246, .06); }
        tbody tr:last-child td { border-bottom: none; }
        td.num { text-align: right; }

        .pill {
            display: inline-block;
            padding: 2px 8px; border-radius: 999px;
            font-size: 11px; font-weight: 600;
            white-space: nowrap;
        }
        .pill.active   { background: rgba(34, 197, 94, .15); color: var(--ok); }
        .pill.pending  { background: rgba(245, 158, 11, .15); color: var(--warn); }
        .pill.blocked  { background: rgba(239, 68, 68, .15);  color: var(--danger); }
        .pill.inactive { background: rgba(148, 163, 184, .15); color: var(--muted); }
        .pill.epos     { background: rgba(59, 130, 246, .15); color: var(--accent); }

        .empty, .loading {
            color: var(--muted); text-align: center; padding: 32px;
        }

        /* Drawer detalle */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, .55);
            display: none; z-index: 10;
        }
        .overlay.open { display: block; }
        .drawer {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: 100%; max-width: 560px;
            background: var(--card);
            border-left: 1px solid var(--border);
            padding: 24px 28px;
            overflow-y: auto;
            z-index: 11;
            transform: translateX(100%);
            transition: transform .18s ease-out;
        }
        .drawer.open { transform: translateX(0); }
        .drawer header {
            background: transparent; border: 0; padding: 0 0 16px;
        }
        .drawer h3 { font-size: 18px; }
        .drawer .close {
            background: none; border: 0; color: var(--muted);
            font-size: 20px; cursor: pointer;
        }
        .drawer .close:hover { color: var(--text); }

        .kv {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 10px 16px;
            font-size: 13px;
            margin-bottom: 18px;
        }
        .kv dt { color: var(--muted); }
        .kv dd { color: var(--text); overflow-wrap: anywhere; }

        .section-title {
            font-size: 11px; text-transform: uppercase;
            letter-spacing: .04em; color: var(--muted);
            margin: 18px 0 10px; padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .toast {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%);
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); padding: 12px 20px;
            border-radius: 8px; font-size: 14px;
            display: none;
        }
        .toast.show { display: block; }

        /* Formulario de edición (F3.2) */
        .edit-form { display: flex; flex-direction: column; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
        .form-group input,
        .form-group select {
            padding: 8px 10px;
            background: rgba(15,23,42,.6);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text); font-size: 13px;
        }
        .form-group input:focus,
        .form-group select:focus { outline: none; border-color: var(--accent); }
        .form-group.check-row { flex-direction: row; align-items: center; gap: 8px; }
        .form-group.check-row label { text-transform: none; font-size: 13px; color: var(--text); cursor: pointer; }
        .form-group.check-row input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
        .form-actions { display: flex; gap: 10px; margin-top: 6px; }
        .btn-primary {
            flex: 1; padding: 9px 16px;
            background: var(--accent); color: #fff;
            border: none; border-radius: 6px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
        .btn-secondary {
            flex: 1; padding: 9px 16px;
            background: transparent; color: var(--muted);
            border: 1px solid var(--border); border-radius: 6px;
            font-size: 14px; cursor: pointer;
        }
        .btn-secondary:hover { color: var(--text); }
        .btn-link {
            background: none; border: none; padding: 4px 8px;
            color: var(--accent); font-size: 13px; cursor: pointer;
            border-radius: 4px;
        }
        .btn-link:hover { background: rgba(59,130,246,.1); }
        .drawer-toolbar { display: flex; justify-content: flex-end; margin-bottom: 14px; }

        /* Billing table (F3.4) */
        .billing-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
        .billing-table th {
            text-align: left; padding: 6px 8px; font-size: 10px;
            text-transform: uppercase; letter-spacing: .04em;
            color: var(--muted); border-bottom: 1px solid var(--border);
        }
        .billing-table td { padding: 7px 8px; border-bottom: 1px solid rgba(51,65,85,.4); }
        .billing-table tbody tr:hover { background: rgba(59,130,246,.04); }
        .billing-table td.num { text-align: right; }
        .billing-stat { display: flex; gap: 16px; flex-wrap: wrap; margin: 6px 0 14px; }
        .billing-stat-item { display: flex; flex-direction: column; gap: 2px; }
        .billing-stat-item .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing:.04em; }
        .billing-stat-item .value { font-size: 18px; font-weight: 700; color: var(--text); }
        .billing-stat-item .sub   { font-size: 11px; color: var(--muted); }

        /* Zona de peligro (F3.3) */
        .danger-zone { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
        .danger-item {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 10px 12px;
            background: rgba(239, 68, 68, .05);
            border: 1px solid rgba(239, 68, 68, .2);
            border-radius: 8px;
        }
        .danger-info { display: flex; flex-direction: column; gap: 2px; }
        .danger-info strong { font-size: 13px; color: var(--text); }
        .danger-info span   { font-size: 12px; color: var(--muted); }
        .btn-warn {
            padding: 7px 14px; border-radius: 6px;
            background: transparent;
            border: 1px solid var(--warn); color: var(--warn);
            font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .btn-warn:hover { background: rgba(245, 158, 11, .1); }
        .btn-danger {
            padding: 7px 14px; border-radius: 6px;
            background: transparent;
            border: 1px solid var(--danger); color: var(--danger);
            font-size: 13px; cursor: pointer; white-space: nowrap;
        }
        .btn-danger:hover { background: rgba(239, 68, 68, .1); }
        .btn-danger-primary {
            flex: 1; padding: 9px 16px;
            background: var(--danger); color: #fff;
            border: none; border-radius: 6px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .btn-danger-primary:disabled { opacity: .4; cursor: not-allowed; }
        .danger-notice {
            background: rgba(239, 68, 68, .08);
            border: 1px solid rgba(239, 68, 68, .3);
            border-radius: 8px; padding: 14px 16px;
            margin-bottom: 16px;
        }
        .danger-notice strong { color: var(--danger); font-size: 14px; display: block; margin-bottom: 6px; }
        .danger-notice p { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }
    </style>
</head>

<body>
    <header>
        <h1>Punto · Admin</h1>
        <nav>
            <a href="/admin">Inicio</a>
            <a href="#" id="logoutBtn">Cerrar sesión</a>
        </nav>
    </header>

    <main>
        <div class="toolbar">
            <h2>Empresas</h2>
            <input type="search" class="search" id="searchInput" placeholder="Buscar por nombre…">
            <span class="stats" id="stats"></span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Propietario</th>
                    <th>Email</th>
                    <th>País</th>
                    <th>Estado</th>
                    <th>Plan</th>
                    <th class="num">Suc.</th>
                    <th class="num">Cajas</th>
                    <th>ePOS</th>
                    <th>Creada</th>
                    <th>Último uso</th>
                </tr>
            </thead>
            <tbody id="rows">
                <tr><td colspan="11" class="loading">Cargando…</td></tr>
            </tbody>
        </table>
    </main>

    <div class="overlay" id="overlay"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
        <header>
            <h3 id="drawerTitle">Detalle</h3>
            <button class="close" id="closeDrawer" aria-label="Cerrar">×</button>
        </header>
        <div id="drawerBody">
            <p class="loading">Cargando…</p>
        </div>
    </aside>

    <div class="toast" id="toast"></div>

    <script src="/admin/scripts/companies.js"></script>
</body>

</html>
