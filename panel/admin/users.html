<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Punto · Admin · Administradores</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
            --danger: #ef4444;
            --ok: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        header nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            margin-right: 16px;
        }

        header nav a:hover {
            color: var(--text);
        }

        main {
            max-width: 960px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .toolbar h2 {
            font-size: 20px;
        }

        .btn {
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: #fff;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .btn.danger {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            text-align: left;
            padding: 12px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--muted);
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .pill.active {
            background: rgba(34, 197, 94, .15);
            color: var(--ok);
        }

        .pill.inactive {
            background: rgba(148, 163, 184, .15);
            color: var(--muted);
        }

        .row-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .row-actions .link {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 13px;
            padding: 0;
        }

        .row-actions .link.danger {
            color: var(--danger);
        }

        .empty {
            color: var(--muted);
            text-align: center;
            padding: 32px;
        }

        /* Modal */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .overlay.open {
            display: flex;
        }

        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
        }

        .modal h3 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .modal label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
            margin-top: 14px;
        }

        .modal input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
        }

        .modal input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal .hint {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .modal-error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 14px;
            min-height: 18px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .toast.show {
            display: block;
        }
    </style>
</head>

<body>
    <header>
        <h1>Punto · Admin</h1>
        <nav>
            <a href="/admin">Inicio</a>
            <a href="#" id="logoutBtn">Cerrar sesión</a>
        </nav>
    </header>

    <main>
        <div class="toolbar">
            <h2>Administradores</h2>
            <button class="btn" id="newBtn">Nuevo admin</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Estado</th>
                    <th>Último ingreso</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="rows">
                <tr>
                    <td colspan="5" class="empty">Cargando…</td>
                </tr>
            </tbody>
        </table>
    </main>

    <div class="overlay" id="overlay">
        <div class="modal">
            <h3 id="modalTitle">Nuevo admin</h3>
            <form id="adminForm">
                <input type="hidden" id="f_id">
                <label for="f_name">Nombre</label>
                <input type="text" id="f_name" autocomplete="off">
                <label for="f_email">Email</label>
                <input type="email" id="f_email" autocomplete="off" required>
                <label for="f_password">Contraseña</label>
                <input type="password" id="f_password" autocomplete="new-password">
                <div class="hint" id="passHint">Mínimo 8 caracteres.</div>
                <div class="modal-error" id="modalError"></div>
                <div class="modal-actions">
                    <button type="button" class="btn secondary" id="cancelBtn">Cancelar</button>
                    <button type="submit" class="btn" id="saveBtn">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/admin/scripts/users.js"></script>
</body>

</html>
