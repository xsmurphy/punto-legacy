<!DOCTYPE html>
<!--
  CRUD de super-admins (/admin/users, F2) — estático, standalone, gated por _jwt_admin.
  Estilos vía design system (assets/design/*) — ver context/11-design-system.md.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punto · Admin · Administradores</title>
  <link rel="stylesheet" href="/assets/design/tokens.css?v=3">
  <link rel="stylesheet" href="/assets/design/base.css?v=3">
</head>

<body class="ds-app">
  <header class="ds-header">
    <span class="ds-header__brand">Punto · Admin</span>
    <nav class="ds-header__nav">
      <a href="/admin">Inicio</a>
      <a href="#" id="logoutBtn">Cerrar sesión</a>
    </nav>
  </header>

  <main class="ds-main">
    <div class="ds-toolbar">
      <h2>Administradores</h2>
      <button class="ds-btn" id="newBtn">Nuevo admin</button>
    </div>

    <table class="ds-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Estado</th>
          <th>Último ingreso</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="ds-table__empty">Cargando…</td></tr>
      </tbody>
    </table>
  </main>

  <div class="ds-overlay" id="overlay">
    <div class="ds-modal">
      <h3 id="modalTitle">Nuevo admin</h3>
      <form id="adminForm">
        <input type="hidden" id="f_id">
        <label class="ds-label" for="f_name">Nombre</label>
        <input class="ds-input" type="text" id="f_name" autocomplete="off">
        <label class="ds-label" for="f_email">Email</label>
        <input class="ds-input" type="email" id="f_email" autocomplete="off" required>
        <label class="ds-label" for="f_password">Contraseña</label>
        <input class="ds-input" type="password" id="f_password" autocomplete="new-password">
        <div class="ds-hint" id="passHint">Mínimo 8 caracteres.</div>
        <div class="ds-form-error" id="modalError"></div>
        <div class="ds-modal-actions">
          <button type="button" class="ds-btn ds-btn--secondary" id="cancelBtn">Cancelar</button>
          <button type="submit" class="ds-btn" id="saveBtn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="ds-toast" id="toast"></div>

  <script src="/admin/scripts/users.js?v=2"></script>
</body>

</html>
