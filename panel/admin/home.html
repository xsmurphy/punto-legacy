<!DOCTYPE html>
<!--
  Home del ADMIN REALM (/admin) — estático, gated client-side: al cargar pide /bff/admin/me.php;
  si 401 (sin sesión admin válida) redirige a /admin/login. Placeholder de F1 — el CRUD de admins
  (F2) y la gestión de companies/billing (F3) se montan acá.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Punto</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
           font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.5rem;
             background:var(--card); border-bottom:1px solid #334155; }
    header b { font-size:1rem; }
    .who { color:var(--muted); font-size:.85rem; }
    button { padding:.45rem .9rem; border:0; border-radius:8px; background:#334155; color:var(--fg); cursor:pointer; font-size:.85rem; }
    main { padding:2rem 1.5rem; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; max-width:720px; }
    .card { display:block; padding:1.25rem; background:var(--card); border:1px solid #334155; border-radius:12px;
            color:var(--fg); text-decoration:none; }
    .card:hover { border-color:var(--accent); }
    .card h3 { margin:0 0 .35rem; font-size:1rem; }
    .card p { margin:0; color:var(--muted); font-size:.82rem; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div id="app" class="hidden">
    <header>
      <b>Panel de administración</b>
      <span>
        <span class="who" id="who"></span>
        <button id="logoutBtn">Salir</button>
      </span>
    </header>
    <main>
      <div class="cards">
        <a class="card" href="/admin/users">
          <h3>Administradores</h3>
          <p>Crear, editar y activar/desactivar super-admins de la plataforma.</p>
        </a>
        <a class="card" href="/admin/companies">
          <h3>Empresas</h3>
          <p>Listar y consultar todas las empresas (tenants) del sistema.</p>
        </a>
      </div>
    </main>
  </div>

  <script>
  (function () {
    fetch('/bff/admin/me.php', { credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) { throw new Error('401'); } return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) { throw new Error('401'); }
        document.getElementById('who').textContent = (res.data && (res.data.name || res.data.email)) || '';
        document.getElementById('app').classList.remove('hidden');
      })
      .catch(function () { window.location.href = '/admin/login'; });

    document.addEventListener('click', function (e) {
      if (e.target && e.target.id === 'logoutBtn') {
        fetch('/bff/admin/logout.php', { method: 'POST', credentials: 'same-origin' })
          .then(function () { window.location.href = '/admin/login'; });
      }
    });
  })();
  </script>
</body>
</html>
