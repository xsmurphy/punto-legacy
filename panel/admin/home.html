<!DOCTYPE html>
<!--
  Home del ADMIN REALM (/admin) — estático, gated client-side: al cargar pide /bff/admin/me.php;
  si 401 (sin sesión admin válida) redirige a /admin/login. Acá se montan el CRUD de admins
  (F2, /admin/users) y la gestión de companies/billing (F3).
  Estilos vía design system (assets/design/*) — ver context/11-design-system.md.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Punto</title>
  <link rel="stylesheet" href="/assets/design/tokens.css?v=3">
  <link rel="stylesheet" href="/assets/design/base.css?v=3">
</head>
<body class="ds-app">
  <div id="app" class="ds-hidden">
    <header class="ds-header">
      <span class="ds-header__brand">Panel de administración</span>
      <span class="ds-header__nav">
        <span class="ds-muted" id="who"></span>
        <a href="#" id="logoutBtn">Salir</a>
      </span>
    </header>
    <main class="ds-main">
      <div class="ds-cards">
        <a class="ds-card-link" href="/admin/users">
          <h3>Administradores</h3>
          <p>Crear, editar y activar/desactivar super-admins de la plataforma.</p>
        </a>
      </div>
    </main>
  </div>

  <script>
  (function () {
    fetch('/bff/admin/me.php', { credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) { throw new Error('401'); } return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) { throw new Error('401'); }
        document.getElementById('who').textContent = (res.data && (res.data.name || res.data.email)) || '';
        document.getElementById('app').classList.remove('ds-hidden');
      })
      .catch(function () { window.location.href = '/admin/login'; });

    document.addEventListener('click', function (e) {
      if (e.target && e.target.id === 'logoutBtn') {
        e.preventDefault();
        fetch('/bff/admin/logout.php', { method: 'POST', credentials: 'same-origin' })
          .then(function () { window.location.href = '/admin/login'; });
      }
    });
  })();
  </script>
</body>
</html>
