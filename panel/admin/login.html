<!DOCTYPE html>
<!--
  Login del ADMIN REALM (/admin/login) — estático, standalone (NO carga el shell del tenant @.php).
  Postea a /bff/admin/login.php (que verifica vía API y setea la cookie HttpOnly _jwt_admin).
  Realm separado del tenant: nada de esto toca _jwt_panel.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Punto</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; --err:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .card { background:var(--card); padding:2.5rem; border-radius:16px; width:100%; max-width:360px;
            box-shadow:0 10px 40px rgba(0,0,0,.4); }
    h1 { margin:0 0 .25rem; font-size:1.25rem; }
    p.sub { margin:0 0 1.5rem; color:var(--muted); font-size:.85rem; }
    label { display:block; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:.9rem 0 .35rem; }
    input { width:100%; padding:.7rem .8rem; border-radius:9px; border:1px solid #334155; background:#0f172a; color:var(--fg); font-size:.95rem; }
    input:focus { outline:none; border-color:var(--accent); }
    button { width:100%; margin-top:1.4rem; padding:.75rem; border:0; border-radius:9px; background:var(--accent);
             color:#fff; font-weight:600; font-size:.95rem; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .msg { margin-top:1rem; font-size:.85rem; min-height:1.1em; color:var(--err); text-align:center; }
  </style>
</head>
<body>
  <form class="card" id="adminLoginForm" autocomplete="off">
    <h1>Panel de administración</h1>
    <p class="sub">Acceso de plataforma</p>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autocomplete="username">

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">

    <button type="submit" id="submitBtn">Ingresar</button>
    <div class="msg" id="msg"></div>
  </form>

  <script src="scripts/login.js?v=1"></script>
</body>
</html>
