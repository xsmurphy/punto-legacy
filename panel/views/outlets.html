<!--
  Front del módulo Sucursales (a_outlets) — fragmento estático. PRIMER CRUD del panel en el
  modelo BFF + Alpine (piloto §17). Cero PHP: el shell inyecta este HTML en #bodyContent.

  - Lista: ncmDataTables (jQuery dueño del DOM de la tabla, §17.2) hidratada con las filas crudas
    de /bff/outlets.php.
  - Form de edición: componente Alpine (x-model en los campos escalares), en un modal propio del
    fragmento (dentro del scope x-data). Save → POST /bff/outlets.php (action=update) → recarga.
  - Crear (blank-insert, cascadea register+inventory) y eliminar (cascading) quedan en el PHP
    legacy vía /a_outlets?action=insert|delete. Tras crear, se abre el form Alpine con el id nuevo.
  - DIFERIDO (no se pierde dato — el update preserva esas claves del `data` JSONB): horarios
    operativos (businessHours, widget jQuery) y depósitos (adm() infra compartida). Flag en §17/roadmap.

  Init determinista §17: sin x-data en el markup; a_outlets.js clona el root, le pone x-data,
  Alpine.initTree DETACHED y reinserta (init 1×).
-->
<div class="col-xs-12 no-padder" id="outletsRoot">

  <div class="col-xs-12 wrapper-sm">
    <a href="#" class="btn btn-info hidden-print btn-rounded font-bold text-u-c pull-right" @click.prevent="createOutlet()">Agregar Sucursal</a>
    <span class="m-r m-t-xs pull-left">
      <a href="/@#registers" class="text-default hidden-print">Cajas Registradoras</a>
    </span>
  </div>

  <div class="col-xs-12 wrapper">
    <span class="font-bold h1" id="pageTitle">Sucursales</span>
  </div>

  <div class="col-xs-12 wrapper panel push-chat-down r-24x table-responsive tableContainer">
    <table class="table hover col-xs-12 no-padder" id="tableOutlets"></table>
  </div>

  <!-- Modal de edición (Alpine-bound; el plugin BS3 modal lo abre/cierra jQuery, los campos son x-model) -->
  <div class="modal fade" id="outletEditModal" tabindex="-1" role="dialog">
    <div class="modal-dialog">
      <div class="modal-content r-24x clear all-shadows no-border">
        <form @submit.prevent="save()" autocomplete="off">
          <div class="col-xs-12 no-padder bg-white">
            <div class="col-xs-12 wrapper">

              <div class="col-xs-12 m-t m-b text-u-c font-bold text-lg">Perfil de <span x-text="editing.name"></span></div>

              <div class="col-xs-12 wrapper b-b">
                <div class="col-xs-6 no-padder"><label class="m-t-sm text-u-c font-bold">Nombre de la sucursal</label></div>
                <div class="col-xs-6 no-padder"><input type="text" class="form-control no-border b-b" x-model="editing.name"></div>
              </div>

              <div class="col-xs-12 wrapper b-b">
                <div class="col-xs-6 no-padder"><label class="m-t-sm text-u-c font-bold">Dirección</label></div>
                <div class="col-xs-6 wrapper-xs"><input type="text" class="form-control no-border b-b" x-model="editing.address"></div>
              </div>

              <div class="col-xs-12 wrapper b-b">
                <div class="col-xs-6 no-padder"><label class="m-t-sm text-u-c font-bold">Razón Social</label></div>
                <div class="col-xs-6 wrapper-xs"><input type="text" class="form-control no-border b-b" x-model="editing.billingName"></div>
              </div>

              <div class="col-xs-12 wrapper b-b">
                <div class="col-xs-6 no-padder"><label class="m-t-sm text-u-c font-bold bff-tin-name">RUC</label></div>
                <div class="col-xs-6 no-padder"><input type="text" class="form-control no-border b-b" x-model="editing.ruc"></div>
              </div>

              <div class="col-xs-12 wrapper b-b">
                <div class="col-xs-6 no-padder"><label class="m-t-sm text-u-c font-bold">Teléfono</label></div>
                <div class="col-xs-6 wrapper-xs"><input type="text" class="form-control no-border b-b" x-model="editing.phone"></div>
              </div>

              <div class="col-xs-12 wrapper b-b">
                <div class="col-xs-6 no-padder"><label class="m-t-sm text-u-c font-bold">eMail</label></div>
                <div class="col-xs-6 wrapper-xs"><input type="text" class="form-control no-border b-b" x-model="editing.email"></div>
              </div>

              <div class="col-xs-12 wrapper b-b">
                <div class="col-xs-6 no-padder"><label class="m-t-sm text-u-c font-bold">WhatsApp <small class="text-normal">(formato internacional)</small></label></div>
                <div class="col-xs-6 wrapper-xs"><input type="text" class="form-control no-border b-b" x-model="editing.whatsApp"></div>
              </div>

              <div class="col-xs-12 wrapper b-b">
                <div class="col-xs-6 no-padder"><label class="m-t-sm text-u-c font-bold">Coordenadas</label></div>
                <div class="col-xs-6 wrapper-xs"><input type="text" class="form-control no-border b-b" x-model="editing.latLng" placeholder="Coordenadas o link de Google Maps"></div>
              </div>

              <div class="col-xs-12 m-t m-b text-u-c font-bold text-lg">Configuración</div>

              <div class="col-xs-12 wrapper b-b">
                <div class="col-xs-6 no-padder"><label class="m-t-sm text-u-c font-bold">No. de Orden de Compra</label></div>
                <div class="col-xs-6 wrapper-xs"><input type="number" class="form-control no-border b-b text-right" x-model="editing.purchaseOrderNo"></div>
              </div>

              <div class="col-xs-12 wrapper b-b">
                <div class="col-xs-6 no-padder"><label class="m-t-sm text-u-c font-bold">Impuesto a la Venta</label></div>
                <div class="col-xs-6 wrapper-xs">
                  <select class="form-control no-bg no-border b-b b-light" x-model="editing.taxId">
                    <option value="">Ninguno</option>
                    <template x-for="t in availableTaxes" :key="t.id">
                      <option :value="t.id" x-text="t.name"></option>
                    </template>
                  </select>
                </div>
              </div>

              <div class="col-xs-12 wrapper b-b">
                <div class="col-xs-6 no-padder"><label class="m-t-sm text-u-c font-bold"><span class="bff-tax-name">IVA</span> incluído</label></div>
                <div class="col-xs-6 wrapper-xs text-right">
                  <label class="i-switch i-switch-md bg-info m-t-xs m-b-n-xxs">
                    <input type="checkbox" x-model="editing.taxIncluded"><i></i>
                  </label>
                </div>
              </div>

              <div class="col-xs-12 wrapper b-b">
                <div class="col-xs-6 no-padder"><label class="m-t-sm text-u-c font-bold">Online</label></div>
                <div class="col-xs-6 wrapper-xs text-right">
                  <label class="i-switch i-switch-md bg-info m-t-xs m-b-n-xxs">
                    <input type="checkbox" x-model="editing.ecom"><i></i>
                  </label>
                </div>
              </div>

            </div>

            <div class="col-xs-12 wrapper bg-light lter m-t">
              <a href="#" class="pull-left deleteItem m-t" x-show="editing.id && editing.id !== currentOutletId" @click.prevent="removeOutlet()"><span class="text-danger">Eliminar</span></a>

              <div class="form-group pull-left">
                <label>Estado:</label>
                <input type="checkbox" x-model="editing.statusOn" value="1">
              </div>

              <input class="btn btn-info btn-lg btn-rounded text-u-c font-bold pull-right" type="submit" :value="saving ? 'Guardando…' : 'Guardar'" :disabled="saving">
              <a href="#" class="m-r-lg m-t pull-right" @click.prevent="closeModal()">Cancelar</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>

<script src="scripts/a_outlets.js?v=bff1"></script>
