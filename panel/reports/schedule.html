<!--
  Front del reporte de Agendamientos (a_report_schedule) — fragmento estático.
  Cero PHP. scripts/a_report_schedule.js pide config a /bff/bootstrap.php y las 3 vistas de lectura
  a /bff/reports/schedule.php (crudas): detail (Detallado + summary), stats (Estadísticas/Clientes),
  sessions (Sesiones). El modal de sesiones (detail por id) y el write (delete) se sirven por el PHP
  legacy vía /a_report_schedule?action=; el click en una fila abre el form de TRANSACTIONS legacy.
  Ver context/02-arquitectura.md § REGLA RAÍZ 2.
-->
<div class="col-xs-12 no-padder">
	<div class="col-xs-12 text-center m-t m-b visible-print"><div class="font-bold h3 bff-company-name"></div></div>
	<div class="col-xs-12 no-padder m-b">
		<div class="col-sm-5 m-t-sm">
			<form action="" class="col-md-9 col-xs-12 no-padder" method="post" id="manualDate" name="manualDate">
				<input type="text" id="customDateR" class="form-control no-border bg-white pointer font-bold text-center rounded needsclick" name="range" value="" data-max="31" />
			</form>
		</div>
		<div class="col-sm-7 m-t-sm"><div class="pull-right"><h1 class="no-padder m-n font-bold">Agendamientos</h1></div></div>
	</div>
</div>

<div class="col-xs-12 no-padder text-center hidden-print">
	<div class="col-md-4 col-sm-12 text-center no-padder">
		<canvas id="chart-contado" height="200" style="max-height:200px;"></canvas>
		<div class="donut-inner" style="margin-top:-140px; margin-bottom:100px;">
			<div class="h1 m-t totals font-bold">0</div>
			<span>Total</span>
		</div>
		<div class="m-t-n h4">&nbsp;</div>
	</div>
	<div class="col-md-8 no-padder hidden-print">
		<div class="col-xs-12 no-padder text-center font-bold h4 m-b">Resumen del periodo actual</div>
		<section class="col-md-3 col-sm-6"><div class="b-b text-center wrapper-md"><div class="h1 m-b-xs m-t total font-bold new">0</div>Pendientes</div></section>
		<section class="col-md-3 col-sm-6"><div class="b-b text-center wrapper-md"><div class="h1 m-b-xs m-t total font-bold ended">0</div>Finalizados</div></section>
		<section class="col-md-3 col-sm-6"><div class="b-b text-center wrapper-md"><div class="h1 m-b-xs m-t total font-bold cancelled">0</div>Cancelados</div></section>
		<section class="col-md-3 col-sm-6"><div class="b-b text-center wrapper-md"><div class="h1 m-b-xs m-t total font-bold noshow">0</div>No shows</div></section>
	</div>
</div>

<div class="col-sm-12 no-padder push-chat-down">
	<ul class="nav nav-tabs padder hidden-print">
		<li class="active"><a href="#tableContainer" data-toggle="tab">Detallado</a></li>
		<li id="sessionsTab"><a href="#sessionsList" data-toggle="tab">Sesiones</a></li>
		<li id="statsTab"><a href="#statsList" data-toggle="tab">Estadísticas</a></li>
		<li id="cusStatsTab"><a href="#cusStatsList" data-toggle="tab">Clientes</a></li>
	</ul>
	<section class="panel r-24x">
		<section class="panel-body">
			<div class="tab-content m-b-lg table-responsive">
				<div class="tab-pane active" id="tableContainer"><table class="table col-xs-12 no-padder table-hover" id="tableSchedule"></table></div>
				<div class="tab-pane" id="sessionsList"><table class="table col-xs-12 no-padder table-hover" id="tableSessions"></table></div>
				<div class="tab-pane" id="statsList"><table class="table col-xs-12 no-padder table-hover" id="tableStats"></table></div>
				<div class="tab-pane" id="cusStatsList"><table class="table col-xs-12 no-padder table-hover" id="tableCusStats"></table></div>
			</div>
		</section>
	</section>
</div>

<script src="scripts/a_report_schedule.js?v=bff1"></script>
